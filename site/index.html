<!doctype html>
<!-- windows-toolbox-page: the desktop app only accepts a remote update that contains this marker -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Windows Toolbox</title>
<style>
/* Windows Toolbox: steel and graphite with one safety-yellow accent.
   Yellow means "current" or "chosen": the active section, picked rows, the set bar.
   No external fonts: Bahnschrift (DIN-style, ships with Windows 10/11) for names, Segoe UI for text. */
:root{
  --bg:#E8EBED; --panel:#FFFFFF; --ink:#1C2125; --ink2:#4B565E; --line:#D3D8DC; --line2:#BFC7CC;
  --acc:#FFC20E; --acc-ink:#1C2125; --ok:#17794B; --bad:#B3261E; --plate:#1C2125; --plate-ink:#F4F6F7;
  --focus:#1C2125; --shadow:0 12px 32px rgba(20,28,34,.30);
  --disp:"Bahnschrift","DIN Alternate","Arial Narrow","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --text:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181B; --panel:#1D2327; --ink:#E9EDEF; --ink2:#9AA6AD; --line:#2A3238; --line2:#3B464E;
    --ok:#4CC38A; --bad:#FF8A80; --plate:#2C353B; --plate-ink:#F4F6F7; --focus:#FFC20E; --shadow:0 12px 32px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#14181B; --panel:#1D2327; --ink:#E9EDEF; --ink2:#9AA6AD; --line:#2A3238; --line2:#3B464E;
  --ok:#4CC38A; --bad:#FF8A80; --plate:#2C353B; --plate-ink:#F4F6F7; --focus:#FFC20E; --shadow:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hh,72px) + var(--rh,0px) + 14px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--text);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.selbar :focus-visible,.cmd :focus-visible{outline-color:var(--acc)}   /* these sit on graphite, where the light-theme focus colour vanishes */
button{font:inherit;color:inherit}
kbd{font:600 .8rem var(--mono);background:var(--panel);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 7px}

/* top bar: brand, the search (the hero of the page), tools */
.top{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 1.3rem/1 var(--disp);font-stretch:92%;letter-spacing:.2px;white-space:nowrap}
.brand{min-width:0}
.brand svg{flex:none}
.bn{min-width:0;overflow:hidden;text-overflow:ellipsis}
#ver{font:500 .75rem var(--text);color:var(--ink2)}
.search{position:relative;display:block;width:100%;max-width:680px;justify-self:center}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--ink2);pointer-events:none}
.search input{width:100%;height:46px;padding:0 14px 0 42px;border:2px solid var(--ink);border-radius:8px;background:var(--bg);color:var(--ink);font:500 1.05rem var(--text)}
.search input::placeholder{color:var(--ink2)}
.search input:focus-visible{outline:0;box-shadow:0 0 0 4px var(--acc)}
.tools{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.lang button{border:0;background:transparent;padding:0 10px;height:32px;font:600 .8rem var(--text);cursor:pointer}
.lang button+button{border-left:1px solid var(--line2)}
.lang button.on{background:var(--ink);color:var(--panel)}
.tool{height:32px;min-width:32px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:transparent;font:600 .85rem var(--text);cursor:pointer}
.tool:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tool.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.upd{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 16px;background:var(--acc);color:var(--acc-ink);font-weight:600}
.upd .btn{border-color:var(--acc-ink)}
.upd-x{border:0;background:transparent;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px}
.offline{padding:6px 16px;text-align:center;background:var(--bad);color:#fff;font-weight:600}
:root[data-theme="dark"] .offline{color:#1D2327}

/* layout: section rail + list */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding:20px}
.rail{position:sticky;top:calc(var(--hh,72px) + 14px);align-self:start;max-height:calc(100vh - var(--hh,72px) - 28px);overflow:auto}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;text-align:left;width:100%;padding:8px 10px;border:0;border-radius:6px;background:transparent;cursor:pointer;font:600 .95rem var(--disp);font-stretch:95%}
.tab:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tab.on{background:var(--panel);box-shadow:inset 4px 0 0 var(--acc),0 0 0 1px var(--line)}
.tab .tn{font:500 .75rem var(--text);color:var(--ink2)}
.tab .ti{text-align:center}

section{margin:0 0 44px}
.sec-h{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.sec-ic{font-size:2rem;line-height:1}
.sec-h h2{margin:0;font:700 1.9rem/1.1 var(--disp);font-stretch:92%}
.sec-h p{margin:4px 0 0;color:var(--ink2);max-width:70ch}
.group{margin-top:22px}
.group h3{margin:0 0 8px}
.plate{display:inline-block;padding:4px 12px;border-radius:4px;background:var(--plate);color:var(--plate-ink);font:600 .95rem var(--disp);font-stretch:95%}
.gnote{margin:0 0 8px;color:var(--ink2);font-size:.9rem;max-width:70ch}
.note{margin:18px 0 0;padding:10px 14px;border-left:4px solid var(--acc);background:var(--panel);border-radius:0 6px 6px 0;max-width:70ch}
.sub{margin:26px 0 10px;font:600 1.15rem var(--disp)}

/* app rows */
.rows{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card{--pickw:0px;display:grid;grid-template-columns:var(--pickw) minmax(0,1fr) auto;align-items:center;padding:12px 16px 12px 12px;border-top:1px solid var(--line)}
.rows>.card:first-child{border-top:0}
body.selecting .card{--pickw:36px}
.card:hover{background:color-mix(in srgb,var(--ink) 4%,var(--panel))}
.card.picked{background:color-mix(in srgb,var(--acc) 16%,var(--panel));box-shadow:inset 4px 0 0 var(--acc)}
.card.hidden,.group.hidden,section.hidden{display:none}
.pick{display:grid;place-items:center;width:var(--pickw);overflow:hidden;visibility:hidden;cursor:pointer}
body.selecting .pick{visibility:visible}
.pick input{width:18px;height:18px;margin:0;accent-color:var(--ink);cursor:pointer}
.info{min-width:0;padding-right:14px;padding-left:4px}
.name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name a{font:600 1.08rem/1.25 var(--disp);font-stretch:95%;text-decoration:none}
.name a:hover{text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:3px;text-underline-offset:3px}
.repo{font-size:.78rem;color:var(--ink2);overflow-wrap:anywhere}
.info p{margin:2px 0 0;color:var(--ink2);max-width:72ch}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.meta:empty{display:none}
.chip{padding:1px 9px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink2);font-size:.75rem}
.chip.warn{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.st{display:none;margin-top:6px;font-size:.8rem;color:var(--ink2)}
.st.show{display:block}
.acts{display:flex;gap:6px;align-items:center;justify-content:flex-end}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:transparent;color:var(--ink);font:600 .85rem var(--text);text-decoration:none;white-space:nowrap;cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{width:32px;padding:0}
.btn .ic{font-weight:700}
.btn.dl.busy{opacity:.7;cursor:progress}
.btn.dl.ok{color:var(--ok);border-color:var(--ok)}
.btn.inst{border-color:var(--ink);color:var(--ink)}
.btn.inst:hover{background:var(--ink);color:var(--panel)}
.btn.inst.busy{opacity:.6;cursor:progress}
.btn.inst.done,.btn.inst.done:hover{background:transparent;color:var(--ok);border-color:var(--ok)}
.btn.inst.err{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.inst.upg,.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover,.btn.inst.upg:hover{background:var(--acc);opacity:.9}

.empty{padding:60px 16px;text-align:center;color:var(--ink2);font-size:1.05rem}

/* Windows tricks and safety */
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.key{display:flex;gap:12px;align-items:center;min-width:0;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.key>span:last-child{min-width:0;overflow-wrap:anywhere}
.combo{display:flex;gap:4px;align-items:center;flex:none;flex-wrap:wrap;max-width:60%}
.combo .pl{color:var(--ink2)}
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.tip{padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.tip b{display:block;font:600 1rem var(--disp);margin-bottom:2px}
.tip span{color:var(--ink2)}
.tip code,.warn code{font:.85em var(--mono);background:color-mix(in srgb,var(--ink) 8%,transparent);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.cmds{display:grid;gap:10px}
.cmd{background:var(--plate);color:var(--plate-ink);border-radius:8px;overflow:hidden}
.cmd-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;font-weight:600}
.cmd .copy{border:1px solid #56626A;border-radius:6px;background:transparent;color:var(--plate-ink);padding:3px 10px;cursor:pointer;font:600 .8rem var(--text)}
.cmd .copy.done{color:#7DE0AE;border-color:#7DE0AE}
.cmd pre{margin:0;padding:10px 12px 12px;background:#0F1316;color:#D7E3DC;font:.85rem/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.warn{margin:0;padding-left:1.4rem;max-width:72ch}
.warn li{margin:0 0 10px}

/* the set bar: the one loud element. It appears when selecting and prints the command live. */
.selbar{position:fixed;left:50%;bottom:16px;z-index:40;width:min(980px,calc(100% - 24px));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--plate);color:var(--plate-ink);box-shadow:var(--shadow);transform:translate(-50%,160%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
body.selecting .selbar{transform:translate(-50%,0);visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#selCount{font:700 1.05rem var(--disp);white-space:nowrap}
.selcmd{display:block;min-width:0;padding:8px 10px;border-radius:6px;background:#0F1316;color:#D7E3DC;font:.8rem/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selcmd::before{content:"PS> ";color:var(--acc)}
.selcmd.idle{color:#8794A0}
.selbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.selbar .btn{border-color:#56626A;color:var(--plate-ink)}
.selbar .btn:hover{background:rgba(255,255,255,.1)}
.selbar .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.selbar .btn.danger{color:#FFB4AB}
body.selecting .layout{padding-bottom:150px}

dialog{width:min(580px,calc(100% - 24px));padding:0;border:0;border-radius:10px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,17,.55)}
.dlg{padding:18px 20px 20px}
.dlg h3{margin:0 0 12px;font:700 1.25rem var(--disp)}
.dlg p{margin:0 0 10px;color:var(--ink2)}
.dlg textarea,.dlg input[type=text]{width:100%;padding:10px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink);font:.85rem/1.45 var(--mono)}
.dlg textarea{min-height:240px;resize:vertical}
.dlg .row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
.setrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow span{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.setrow small{color:var(--ink2)}
.err-t{min-height:1.2em;margin:6px 0 0;color:var(--bad);font-size:.85rem}
.btn.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;z-index:60;display:flex;gap:12px;align-items:center;max-width:calc(100% - 24px);padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--panel);box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.selecting .toast{bottom:104px}
footer{max-width:1280px;margin:0 auto;padding:10px 20px 40px;color:var(--ink2);font-size:.85rem;text-align:center}
footer a{color:inherit}

@media (max-width:900px){
  .top{grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;padding:10px 12px}
  .search{grid-column:1/-1;grid-row:2;max-width:none}
  .layout{display:block;padding:0 12px 20px}
  .rail{position:sticky;top:var(--hh,100px);z-index:20;max-height:none;overflow-x:auto;margin:0 -12px 8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
  .tabs{flex-direction:row;gap:6px;width:max-content}
  .tab{display:flex;gap:6px;width:auto;padding:6px 12px;border:1px solid var(--line2);border-radius:99px;white-space:nowrap}
  .tab.on{box-shadow:none;background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
  .tab .tn{display:none}
  .sec-h h2{font-size:1.5rem}
  .card{grid-template-columns:var(--pickw) minmax(0,1fr);row-gap:10px}
  .acts{grid-column:2;justify-content:flex-start;flex-wrap:wrap}
  .selbar{grid-template-columns:minmax(0,1fr) auto}
  .selcmd{grid-column:1/-1;grid-row:2}
  .selbtns{grid-column:1/-1;grid-row:3;justify-content:flex-start}
  .tool .t{display:none}
  .brand{font-size:1.1rem}
  #ver{display:none}
  .keys,.tips{grid-template-columns:minmax(0,1fr)}
  body.selecting .toast{bottom:190px}
  body.selecting .layout{padding-bottom:230px}
}
@media (prefers-reduced-motion:reduce){.selbar,.toast{transition:none}}
</style>
</head>
<body>
<div class="offline" id="offline" role="status" hidden data-i18n="offline"></div>
<div class="upd" id="upd" hidden>
  <span id="updMsg"></span>
  <a class="btn" id="updLink" href="#" target="_blank" rel="noopener" hidden data-i18n="download"></a>
  <button class="btn" id="updRestart" type="button" hidden data-i18n="restart"></button>
  <button class="upd-x" id="updX" type="button" data-i18n-title="hide" aria-label="Hide">✕</button>
</div>

<header class="top" id="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M10 9V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="2.5" y="9" width="25" height="17" rx="3" fill="currentColor"/><rect x="2.5" y="15" width="25" height="4" fill="#FFC20E"/><rect x="12.5" y="13.5" width="5" height="7" rx="1" fill="#FFC20E" stroke="currentColor" stroke-width="1.6"/></svg>
    <span class="bn">Windows Toolbox</span><span id="ver"></span>
  </div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" data-i18n-ph="searchPh" autocomplete="off" spellcheck="false">
  </label>
  <div class="tools">
    <div class="lang" id="lang" role="group" aria-label="Language">
      <button type="button" data-l="en">EN</button><button type="button" data-l="uk">UA</button><button type="button" data-l="ru">RU</button>
    </div>
    <button class="tool long" id="selBtn" type="button" aria-pressed="false" data-i18n-title="selectTitle"></button>
    <button class="tool" id="theme" type="button" data-i18n-title="themeTitle" aria-label="Theme">☾</button>
  </div>
</header>

<div class="layout">
  <nav class="rail" id="rail" aria-label="Sections"><div class="tabs" id="tabs"></div></nav>
  <main id="main"></main>
</div>
<div class="empty" id="empty" style="display:none" data-i18n="empty"></div>

<div class="selbar" id="selbar" role="region" aria-label="Set">
  <b id="selCount"></b>
  <code class="selcmd idle" id="selCmd"></code>
  <div class="selbtns">
    <button class="btn primary" id="selInstall" type="button"></button>
    <button class="btn" id="selScript" type="button" data-i18n="script"></button>
    <button class="btn" id="selSave" type="button" data-i18n="saveSet"></button>
    <button class="btn" id="selShare" type="button" data-i18n="share"></button>
    <button class="btn" id="selSets" type="button" data-i18n="sets"></button>
    <button class="btn danger" id="selClear" type="button" data-i18n="clear"></button>
  </div>
</div>

<dialog id="setsDlg"><form method="dialog" class="dlg">
  <h3 data-i18n="setsTitle"></h3>
  <div id="setList"></div>
  <p style="margin-top:14px" data-i18n="importSet"></p>
  <input type="text" id="setImport" autocomplete="off" spellcheck="false">
  <p class="err-t" id="setErr"></p>
  <div class="row"><button class="btn" id="setImportBtn" type="button" data-i18n="openSet"></button><button class="btn primary" value="close" data-i18n="closeDlg"></button></div>
</form></dialog>

<dialog id="scriptDlg"><form method="dialog" class="dlg">
  <h3 data-i18n="scriptTitle"></h3>
  <p data-i18n="scriptHint"></p>
  <textarea id="scriptText" readonly spellcheck="false"></textarea>
  <div class="row"><button class="btn" id="scriptCopy" type="button" data-i18n="copy"></button><button class="btn" id="scriptSave" type="button" data-i18n="saveScript"></button><button class="btn primary" value="close" data-i18n="closeDlg"></button></div>
</form></dialog>

<footer><span data-i18n="footer"></span></footer>
<div class="toast" id="toast" role="status"></div>

<!-- filled by tools/build.mjs from catalog.json / downloads.json; empty in the source file -->
<script id="catalog-data" type="application/json"></script>
<script id="downloads-data" type="application/json"></script>

<script>
(async () => {

 en: {

  hotkeys: "Hotkeys", hidden: "Hidden features", cmds: "Handy commands (terminal as administrator)",
  copy: "Copy", copied: "Copied ✓", archived: "archived",
  starsTitle: "GitHub stars", relTitle: "Latest release",
  install: "Install", installTitle: "Install silently with winget", installed: "Installed", upgrade: "Update",
  queued: "Queued", installing: "Installing…", installFail: "Failed ({0})", installDone: "{0} installed", installErr: "{0}: installation failed",
  select: "Select", selectDone: "Done", selectTitle: "Pick several apps to install together or share as a set",
  selCount: "Selected: {0}", installAll: "Install ({0})", script: "Script", saveSet: "Save set", share: "Share", sets: "Sets", clear: "Clear",

const SKIP_EXT = /\.(sha\d*|sig|asc|txt|json|ya?ml|blockmap|pdb|sym|md5|dmg|pkg|appimage|deb|rpm|apk|aab|ipa|flatpak|snap|tar\.(gz|xz|bz2|zst)|tgz|xz)$/;
const SKIP_NAME = /(linux|macos|darwin|osx|android|ios|freebsd|source|src|debug|symbols|dbgsym)/;
// Same scoring as tools/resolve.mjs; keep the two in sync.
function pickAsset(assets) {
  let best = null, bs = -1e9;
  for (const a of assets) {
    const n = a.name.toLowerCase();
    if (SKIP_EXT.test(n) || SKIP_NAME.test(n)) continue;
    let s;
    if (n.endsWith(".exe")) s = 50; else if (n.endsWith(".msi")) s = 45;
    else if (/\.msix(bundle)?$/.test(n)) s = 30; else if (n.endsWith(".zip")) s = 25;
    else if (n.endsWith(".7z")) s = 20; else continue;
    const win = /win/.test(n);
    if (win) s += 20;
    if (/(x64|amd64|x86_64|win64)/.test(n)) s += 10;
    if (/(arm64|aarch64|arm)/.test(n)) s -= 40;
    if (/(x86|win32|i386|i686)/.test(n) && !/x86_64/.test(n)) s -= 8;
    if (/(setup|install)/.test(n)) s += 4;
    if (/(\dto\d|update|patch|delta|uninstall)/.test(n)) s -= 30;
    if (!win && /\.(zip|7z)$/.test(n)) s -= 15;
    if (s > bs) { bs = s; best = a; }
  }
  return bs >= 10 ? best : null;
}

function fromDL(src) {

  if (m.k === "direct") return {url: m.u, direct: true, file: {name: m.u.split("/").pop()}};
  return {url: m.u, direct: false, note: m.k === "site" ? "nSite" : m.k === "org" ? "nOrg" : "nNoWin"};
}
async function findDownload(src) {
  const target = DL_OVERRIDE[src] || src;
  if (target.startsWith("http")) {
    const direct = /\.(zip|exe|msi|7z)$/i.test(target);
    return {url: target, direct, note: direct ? null : "nSite", file: direct ? {name: target.split("/").pop()} : null};
  }
  if (!target.includes("/")) return {url: GH + target, direct: false, note: "nOrg"};
  const page = GH + target + "/releases";
  let rel = null, r = await gh(target + "/releases/latest");
  if (r.status === 403 || r.status === 429) return {url: page, direct: false, note: "nLimit"};
  if (r.ok) rel = await r.json();
  if (!rel || !(rel.assets || []).length) {
    r = await gh(target + "/releases?per_page=6");
    if (r.ok) rel = (await r.json()).find(x => !x.draft && x.assets && x.assets.length) || rel;
  }
  const a = rel && pickAsset(rel.assets || []);
  if (!a) return {url: rel ? page : GH + target, direct: false, note: "nNoWin"};

}

const dlCache = new Map();
document.addEventListener("click", async e => {
  const b = e.target.closest(".btn.dl[data-src]"); if (!b) return;
  const lb = b.querySelector(".lb"), ic = b.querySelector(".ic"), st = b.closest(".card").querySelector(".st");
  if (!navigator.onLine) { st.textContent = T("nNoNet"); st.classList.add("show"); return; }
  b.classList.remove("ok", "alt"); b.classList.add("busy"); lb.textContent = T("dlBusy"); ic.textContent = "…";
  let res = fromDL(b.dataset.src) || dlCache.get(b.dataset.src);
  if (!res) {
    try { res = await findDownload(b.dataset.src); dlCache.set(b.dataset.src, res); }
    catch { const s = b.dataset.src; res = {url: s.startsWith("http") ? s : GH + s + "/releases", direct: false, note: "nOffline"}; }
  }
  b.classList.remove("busy");
  st.textContent = noteText(res); st.classList.add("show");
  if (res.direct) {
    const a = document.createElement("a"); a.href = res.url; a.rel = "noopener"; a.setAttribute("download", "");
    document.body.appendChild(a); a.click(); a.remove();
    b.classList.add("ok"); lb.textContent = T("dlOk"); ic.textContent = "✓";
  } else {
    window.open(res.url, "_blank", "noopener");
    b.classList.add("alt"); lb.textContent = T("dlOpen"); ic.textContent = "↗";
  }
  setTimeout(() => { b.classList.remove("ok", "alt"); lb.textContent = T("dl"); ic.textContent = "↓"; }, 4000);
});

// copy buttons
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); }
  catch { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
}
document.addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  await copyText(b.closest(".cmd").querySelector("pre").textContent);
  b.textContent = T("copied"); b.classList.add("done");
  setTimeout(()=>{ b.textContent = T("copy"); b.classList.remove("done"); }, 1600);
});

// search
const q = document.getElementById("q"), empty = document.getElementById("empty");
function applySearch() {
  const v = q.value.trim().toLowerCase(); let any = false;
  document.querySelectorAll("main section").forEach(s => {
    let secHit = false;
    s.querySelectorAll(".group").forEach(g => {
      let hit = false;
      g.querySelectorAll(".card").forEach(c => { const m = !v || c.dataset.q.includes(v); c.classList.toggle("hidden", !m); if (m) hit = true; });
      g.classList.toggle("hidden", !hit && !!v); secHit ||= hit;
    });
    const plain = !s.querySelector(".group");
    s.classList.toggle("hidden", !!v && (plain || !secHit)); if (!v || secHit) any = true;
  });
  empty.style.display = any ? "none" : "block";
}
q.addEventListener("input", applySearch);
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === "Escape" && document.activeElement === q) { q.value = ""; applySearch(); q.blur(); }
});

// sticky offsets (header and, on phones, the section rail) + active section in the rail
function measure() {
  document.documentElement.style.setProperty("--hh", topEl.offsetHeight + "px");
  document.documentElement.style.setProperty("--rh", phone.matches ? rail.offsetHeight + "px" : "0px");
}
let lastCur = null;
function onScroll() {
  const y = scrollY + topEl.offsetHeight + (phone.matches ? rail.offsetHeight : 0) + 24;
  let cur = secs.length ? secs[0].id : null;
  secs.forEach(s => { if (!s.classList.contains("hidden") && s.offsetTop <= y) cur = s.id; });
  if (cur === lastCur || performance.now() < lockUntil) return;
  lastCur = cur;
  markTab(cur);
}
addEventListener("scroll", onScroll, {passive: true});
addEventListener("resize", () => { measure(); onScroll(); });
addEventListener("load", measure);
measure();

// re-render everything keeping the scroll position (language switch)
function rerender() {
  const y = scrollY;
  render(); applyStatic(); applySearch(); updateSel(); updateVersion(); renderUpdate(); measure();
  scrollTo(0, y); lastCur = null; onScroll();
}
// cheaper refresh of install buttons + "installed" chips only (winget state changed)
function refreshInstallButtons() {
  document.querySelectorAll(".card[data-key]").forEach(c => {
    const it = APPS.get(c.dataset.key); if (!it || !it.w) return;
    const acts = c.querySelector(".acts"), old = acts.querySelector(".inst"), html = installBtn(it);
    if (old && !html) old.remove(); else if (old) old.outerHTML = html; else if (html) acts.insertAdjacentHTML("beforeend", html);
    c.querySelector(".meta").outerHTML = metaHTML(it.r, it);
  });
  updateSel();
}

function saveFile(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ---- select mode, sets, install script -----------------------------------------------------
const selBtn = document.getElementById("selBtn");
const SETS_KEY = "toolbox.sets.v1";
const loadSets = () => { try { const s = JSON.parse(localStorage.getItem(SETS_KEY)); return Array.isArray(s) ? s : []; } catch { return []; } };
const storeSets = s => { try { localStorage.setItem(SETS_KEY, JSON.stringify(s)); } catch {} };
const nameOf = k => (APPS.get(k) || {}).n || k;

function setSelecting(on) {
  document.body.classList.toggle("selecting", on);
  selBtn.classList.toggle("on", on);
  updateSel();
}
function updateSel() {
  const on = document.body.classList.contains("selecting");
  selBtn.innerHTML = `<span aria-hidden="true">☑</span> <span class="t">${esc(on ? T("selectDone") : T("select"))}</span>`;
  selBtn.setAttribute("aria-pressed", String(on));
  document.getElementById("selCount").textContent = T("selCount", selected.size);
  const its = [...selected].map(k => APPS.get(k)).filter(Boolean);
  const todo = its.filter(it => canInstall(it) && !W.installed.has(it.w.toLowerCase()));
  const inst = document.getElementById("selInstall");
  inst.hidden = !(HOST && W.available);
  inst.textContent = T("installAll", todo.length);
  inst.disabled = !todo.length;
  ["selScript", "selSave", "selShare", "selClear"].forEach(id => document.getElementById(id).disabled = !selected.size);
  // the live command: what "Script" would run for the current picks
  const cmd = document.getElementById("selCmd"), wg = its.filter(it => it.w);
  cmd.textContent = wg.length ? wg.map(it => "winget install --id " + it.w).join("; ") : T("previewEmpty");
  cmd.classList.toggle("idle", !wg.length);
}
selBtn.onclick = () => setSelecting(!document.body.classList.contains("selecting"));
document.addEventListener("change", e => {
  const box = e.target.closest(".pick input"); if (!box) return;
  const card = box.closest(".card"), k = card.dataset.key;
  if (box.checked) selected.add(k); else selected.delete(k);
  card.classList.toggle("picked", box.checked);
  updateSel();
});
function applySelection(keys) {
  selected.clear();
  keys.map(canon).filter(k => APPS.has(k)).forEach(k => selected.add(k));
  document.querySelectorAll(".card[data-key]").forEach(c => {
    const on = selected.has(c.dataset.key);
    c.classList.toggle("picked", on);
    const box = c.querySelector(".pick input"); if (box) box.checked = on;
  });
  setSelecting(true);
}
document.getElementById("selClear").onclick = () => applySelection([]);

// share format: <SITE>#set=<owner/repo>,<owner/repo>,… (also accepted pasted on its own)
const setLink = keys => SITE + "#set=" + keys.map(encodeURIComponent).join(",");
function parseSet(text) {
  const m = String(text).match(/#?set=([^\s#]+)/);
  if (!m) return null;
  const keys = m[1].split(",").map(s => { try { return decodeURIComponent(s); } catch { return ""; } }).map(canon).filter(k => APPS.has(k));
  return keys.length ? keys : null;
}
document.getElementById("selShare").onclick = async () => { await copyText(setLink([...selected])); toast(T("shareCopied")); };
document.getElementById("selSave").onclick = () => {
  const name = (prompt(T("setName"), "") || "").trim(); if (!name) return;
  const sets = loadSets().filter(s => s.name !== name);
  sets.unshift({name, keys: [...selected]});
  storeSets(sets.slice(0, 50));
  toast(T("setSaved", name));
};
const setsDlg = document.getElementById("setsDlg"), setList = document.getElementById("setList"), setErr = document.getElementById("setErr");
function renderSets() {
  const sets = loadSets();
  setList.innerHTML = sets.length ? sets.map((s, i) => `<div class="setrow"><span>${esc(s.name)}</span><small>${T("appsN", s.keys.length)}</small>
    <button type="button" class="btn dl" data-load="${i}">${T("load")}</button><button type="button" class="btn danger" data-del="${i}">${T("del")}</button></div>`).join("")
    : `<p class="muted">${T("setsEmpty")}</p>`;
}
document.getElementById("selSets").onclick = () => { renderSets(); setErr.textContent = ""; document.getElementById("setImport").value = ""; setsDlg.showModal(); };
setList.addEventListener("click", e => {
  const sets = loadSets();
  const l = e.target.closest("[data-load]"), d = e.target.closest("[data-del]");
  if (l) { const s = sets[+l.dataset.load]; applySelection(s.keys); setsDlg.close(); toast(T("setLoaded", selected.size)); }
  if (d) { sets.splice(+d.dataset.del, 1); storeSets(sets); renderSets(); }
});
document.getElementById("setImportBtn").onclick = () => {
  const keys = parseSet(document.getElementById("setImport").value);
  if (!keys) return setErr.textContent = T("setBad");
  applySelection(keys); setsDlg.close(); toast(T("setLoaded", keys.length));
};

const scriptDlg = document.getElementById("scriptDlg"), scriptText = document.getElementById("scriptText");
function buildScript(keys) {
  const its = keys.map(k => APPS.get(k)).filter(Boolean);
  const wg = its.filter(it => it.w), manual = its.filter(it => !it.w);
  let s = `# Windows Toolbox — ${new Date().toISOString().slice(0, 10)}\n# PowerShell + winget\n\n`;
  if (wg.length) {
    s += "$apps = @(\n" + wg.map(it => `  "${it.w}"   # ${it.n}`).join(",\n") + "\n)\n\n";
    s += "foreach ($id in $apps) {\n  Write-Host \"==> $id\" -ForegroundColor Cyan\n  winget install --id $id --exact --silent --accept-package-agreements --accept-source-agreements\n}\n";
  }
  if (manual.length) s += `\n# ${T("notInWinget")}\n` + manual.map(it => `#   ${it.n}: ${url(it.r)}`).join("\n") + "\n";
  return s;
}
document.getElementById("selScript").onclick = () => { scriptText.value = buildScript([...selected]); scriptDlg.showModal(); };
document.getElementById("scriptCopy").onclick = async () => { await copyText(scriptText.value); toast(T("scriptCopied")); };
document.getElementById("scriptSave").onclick = () => saveFile("windows-toolbox-install.ps1", "﻿" + scriptText.value, "text/plain");

// a shared link opens the page with #set=…
const hashSet = parseSet(location.hash);
if (hashSet) { applySelection(hashSet); toast(T("setLoaded", hashSet.length)); history.replaceState(null, "", location.pathname + location.search); }

// ---- winget install (desktop app only) -----------------------------------------------------
function parseInstalled(exportJson) {
  try { return new Set(JSON.parse(exportJson).Sources.flatMap(s => s.Packages.map(p => p.PackageIdentifier.toLowerCase()))); }
  catch { return new Set(); }
}
// `winget upgrade` prints a table; long IDs may be cut with "…", so match by prefix
function parseUpgrades(text) {
  const out = new Set(), tokens = String(text).split(/\s+/);
  for (const it of APPS.values()) {
    if (!it.w) continue;
    const id = it.w.toLowerCase();
    if (tokens.some(t => { t = t.toLowerCase(); return t === id || (t.endsWith("…") && t.length > 6 && id.startsWith(t.slice(0, -1))); })) out.add(id);
  }
  return out;
}
function requestInstall(ids) {
  const its = ids.map(w => [...APPS.values()].find(it => it.w === w)).filter(Boolean);
  if (!its.length) return;
  its.forEach(it => W.state.set(it.w.toLowerCase(), "queued"));
  refreshInstallButtons();
  send({cmd: "install", ids: its.map(it => it.w), names: its.map(it => it.n), lang});
}
document.addEventListener("click", e => {
  const b = e.target.closest(".btn.inst"); if (!b || b.classList.contains("done") || b.classList.contains("busy")) return;
  requestInstall([b.dataset.w]);
});
document.getElementById("selInstall").onclick = () =>
  requestInstall([...selected].map(k => APPS.get(k)).filter(it => canInstall(it) && !W.installed.has(it.w.toLowerCase())).map(it => it.w));

// ---- desktop app: version, self-update ---------------------------------------------------------
// The exe opens this page as index.html?appv=<version>[&host=2]; in a normal browser there is neither.
const verEl = document.getElementById("ver");
const updateVersion = () => { verEl.textContent = appv ? T("appVersion", appv) : ""; };
updateVersion();
const upd = document.getElementById("upd"), updMsg = document.getElementById("updMsg");
const updLink = document.getElementById("updLink"), updRestart = document.getElementById("updRestart");
let updState = null;   // {state: "available"|"downloading"|"ready", version, url}
function renderUpdate() {
  let skipped = null; try { skipped = localStorage.getItem("toolbox.skipVersion"); } catch {}
  if (!updState || (updState.state === "available" && skipped === updState.version)) { upd.hidden = true; return; }
  updMsg.textContent = T(updState.state === "ready" ? "updReady" : updState.state === "downloading" ? "updDownloading" : "updAvail", updState.version);
  updLink.hidden = updState.state !== "available";
  if (updState.url) updLink.href = updState.url;
  updRestart.hidden = updState.state !== "ready";
  upd.hidden = false;
}
document.getElementById("updX").onclick = () => {
  upd.hidden = true;
  if (updState && updState.state === "available") try { localStorage.setItem("toolbox.skipVersion", updState.version); } catch {}
};
updRestart.onclick = () => send({cmd: "applyUpdate"});

const semver = v => String(v).replace(/^v/i, "").split(/[.-]/).slice(0, 3).map(x => parseInt(x, 10) || 0);
const newer = (a, b) => { const x = semver(a), y = semver(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i]; return false; };
if (appv && !HOST && !/dev/.test(appv)) {
  // older exe (≤ 1.1) without a host bridge: just point to the new release.
  // latest.json is a plain file (no API rate limit); the GitHub API is the fallback.
  fetch(`${SITE}latest.json?t=${Date.now()}`).then(r => r.ok ? r.json() : Promise.reject())
    .catch(() => gh(REPO + "/releases/latest").then(r => r.ok ? r.json() : null).then(rel => {
      if (!rel) return null;
      const exe = (rel.assets || []).find(a => /\.exe$/i.test(a.name));
      return {version: rel.tag_name, url: exe ? exe.browser_download_url : rel.html_url};
    }))
    .then(l => {
      if (!l || !newer(l.version, appv)) return;
      updState = {state: "available", version: l.version, url: l.url};
      renderUpdate();
    }).catch(() => {});
}

// messages from the exe
if (HOST) HOST.addEventListener("message", e => {
  let m = e.data; if (typeof m === "string") try { m = JSON.parse(m); } catch { return; }
  if (!m || !m.type) return;
  if (m.type === "hello") { W.available = !!m.winget; refreshInstallButtons(); }
  else if (m.type === "scan") {
    if (m.installed != null) W.installed = parseInstalled(m.installed);
    if (m.upgrades != null) W.upgrades = parseUpgrades(m.upgrades);
    refreshInstallButtons();
  } else if (m.type === "progress") {
    const id = String(m.id).toLowerCase(), it = [...APPS.values()].find(x => x.w && x.w.toLowerCase() === id);
    if (m.state === "done") {
      W.state.delete(id); W.installed.add(id); W.upgrades.delete(id);
      if (it) toast(T("installDone", it.n));
    } else if (m.state === "error") {
      W.state.set(id, "error:" + (m.code ?? "?"));
      if (it) toast(T("installErr", it.n));
    } else if (m.state === "cancelled") W.state.delete(id);
    else W.state.set(id, m.state);
    refreshInstallButtons();
  } else if (m.type === "update") {
    updState = m.state === "none" ? null : {state: m.state, version: m.version, url: m.url};
    renderUpdate();
  }
});
send({cmd: "ready", lang});

// ---- language switch ---------------------------------------------------------------------
document.getElementById("lang").addEventListener("click", e => {
  const b = e.target.closest("button[data-l]"); if (!b || b.dataset.l === lang) return;
  lang = b.dataset.l;
  try { localStorage.setItem("toolbox.lang", lang); } catch {}
  rerender();
  send({cmd: "lang", lang});
});

// theme
const root = document.documentElement, tb = document.getElementById("theme");
const setTheme = t => { root.dataset.theme = t; tb.textContent = t === "light" ? "☾" : "☀"; try { localStorage.setItem("theme", t); } catch {} };
let saved = null; try { saved = localStorage.getItem("theme"); } catch {}
setTheme(saved === "light" || saved === "dark" ? saved : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
tb.onclick = () => setTheme(root.dataset.theme === "light" ? "dark" : "light");

updateSel();
onScroll();
document.body.dataset.ready = "1";   // checked by tools/check-page.mjs and tools/test-ui.mjs
})();
</script>
